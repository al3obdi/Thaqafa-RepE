name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    # "edited" is included because retargeting a stacked PR's base fires only
    # an edited event; without it, retargeted PRs reach the merge button with
    # no CI run at all (this happened to PRs #3 and #4).
    types: [opened, synchronize, reopened, edited]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint and test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Poetry
        run: pipx install poetry==2.3.3

      - name: Cache Poetry virtualenv
        uses: actions/cache@v4
        with:
          path: ~/.cache/pypoetry
          key: ${{ runner.os }}-poetry-${{ hashFiles('**/poetry.lock', '**/pyproject.toml') }}
          restore-keys: ${{ runner.os }}-poetry-

      - name: Install dependencies
        run: poetry install --no-interaction --no-ansi

      - name: Run ruff
        run: poetry run ruff check .

      - name: Run black (check only)
        run: poetry run black --check .

      - name: Run mypy
        run: poetry run mypy

      - name: Run tests
        # The coverage floor is a ratchet: raise it as coverage grows, never
        # lower it to make a PR pass.
        run: poetry run pytest --cov=src --cov-report=term-missing --cov-fail-under=85
